<!-- Cart Script & Hosted Checkout Link Integration -->
<script>
    let cart = JSON.parse(localStorage.getItem('crownCart') || '[]');

    // Your exact Supabase project Anon JWT token key (unchanged)
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoemJxbHVtb2h3bHhnYm9kb3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mzg1MDMsImV4cCI6MjEwMDIxNDUwM30.oaLH3NqWFdAvzHm3PGyXMgxo4cFfF4BRSPTR90JcLOM';

    const cartOverlay = document.getElementById('cart-overlay');
    const cartDrawer = document.getElementById('cart-drawer');
    const cartToggleBtn = document.getElementById('cart-toggle-btn');
    const mobileCartBtn = document.getElementById('mobile-cart-btn');
    const cartCloseBtn = document.getElementById('cart-close-btn');
    const cartBadge = document.getElementById('cart-badge');
    const mobileCartBadge = document.getElementById('mobile-cart-badge');
    const cartItemsContainer = document.getElementById('cart-items-container');
    const emptyCartMsg = document.getElementById('empty-cart-msg');
    const cartTotalDisplay = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    // Mobile Menu Toggle
    mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
    });

    // Close mobile menu when a nav link is clicked
    document.querySelectorAll('.mobile-nav-link').forEach(link => {
        link.addEventListener('click', () => mobileMenu.classList.add('hidden'));
    });

    // Cart Drawer Controls
    function openCart() {
        cartOverlay.classList.remove('hidden');
        requestAnimationFrame(() => {
            cartOverlay.classList.remove('opacity-0');
            cartDrawer.classList.remove('translate-x-full');
            cartDrawer.setAttribute('aria-hidden', 'false');
        });
        // Optional: trap focus or focus close button
        cartCloseBtn.focus();
    }

    function closeCart() {
        cartOverlay.classList.add('opacity-0');
        cartDrawer.classList.add('translate-x-full');
        cartDrawer.setAttribute('aria-hidden', 'true');
        setTimeout(() => {
            cartOverlay.classList.add('hidden');
        }, 300);
    }

    cartToggleBtn.addEventListener('click', openCart);
    mobileCartBtn.addEventListener('click', openCart);
    cartCloseBtn.addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    // Escape key closes cart
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !cartDrawer.classList.contains('translate-x-full')) {
            closeCart();
        }
    });

    // Cart Management
    document.querySelectorAll('.add-to-cart-btn').forEach(button => {
        button.addEventListener('click', (e) => {
            const name = e.currentTarget.getAttribute('data-name');
            const priceInCents = parseInt(e.currentTarget.getAttribute('data-price'), 10);

            // Optional: prevent exact duplicates (or change to quantity logic)
            const existing = cart.find(item => item.name === name);
            if (existing) {
                // Simple feedback instead of adding again
                e.currentTarget.textContent = 'Already in Cart';
                setTimeout(() => {
                    e.currentTarget.textContent = e.currentTarget.getAttribute('data-original-text') || 'Add to Cart';
                }, 1500);
                openCart();
                return;
            }

            cart.push({ id: Date.now() + Math.random(), name, price: priceInCents });
            localStorage.setItem('crownCart', JSON.stringify(cart));
            updateCartUI();
            openCart();
        });
    });

    // Store original button text for feedback
    document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.setAttribute('data-original-text', btn.textContent.trim());
    });

    function removeItem(id) {
        cart = cart.filter(item => item.id !== id);
        localStorage.setItem('crownCart', JSON.stringify(cart));
        updateCartUI();
    }

    // Expose for the inline onclick (or better: use event delegation)
    window.removeItem = removeItem;

    function updateCartUI() {
        const count = cart.length;
        cartBadge.textContent = count;
        mobileCartBadge.textContent = count;

        if (count === 0) {
            emptyCartMsg.classList.remove('hidden');
            cartItemsContainer.innerHTML = '';
            cartItemsContainer.appendChild(emptyCartMsg);
            cartTotalDisplay.textContent = '$0.00';
            checkoutBtn.disabled = true;
            return;
        }

        emptyCartMsg.classList.add('hidden');
        cartItemsContainer.innerHTML = '';

        let totalCents = 0;
        cart.forEach(item => {
            totalCents += item.price;
            const itemEl = document.createElement('div');
            itemEl.className = 'flex items-center justify-between bg-black/40 border border-gray-800 p-3 rounded-xl';
            
            const info = document.createElement('div');
            const nameP = document.createElement('p');
            nameP.className = 'text-sm font-bold text-white';
            nameP.textContent = item.name;          // safer than innerHTML
            const priceP = document.createElement('p');
            priceP.className = 'text-xs text-yellow-400 font-semibold';
            priceP.textContent = `$${(item.price / 100).toFixed(2)}`;
            info.appendChild(nameP);
            info.appendChild(priceP);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'text-red-400 hover:text-red-300 text-xs font-bold px-2 py-1';
            removeBtn.textContent = 'Remove';
            removeBtn.addEventListener('click', () => removeItem(item.id));

            itemEl.appendChild(info);
            itemEl.appendChild(removeBtn);
            cartItemsContainer.appendChild(itemEl);
        });

        const totalDollars = totalCents / 100;
        cartTotalDisplay.textContent = `$${totalDollars.toFixed(2)}`;
        checkoutBtn.disabled = false;
    }

    // Initial render (for persisted cart)
    updateCartUI();

    // Trigger Supabase Edge Function to generate Square Hosted Checkout Link
    // (UNCHANGED – keeps your exact integration)
    checkoutBtn.addEventListener('click', async () => {
        if (cart.length === 0) return;
        
        try {
            checkoutBtn.disabled = true;
            checkoutBtn.innerText = 'Generating Secure Checkout...';

            const response = await fetch('https://thzbqlumohwlxgbodopf.supabase.co/functions/v1/create-square-checkout', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({ 
                    items: cart,
                    redirectUrl: window.location.origin + '/success.html'
                })
            });

            const result = await response.json();

            if (response.ok && result.checkoutUrl) {
                // Optional: clear cart only after successful redirect starts
                // localStorage.removeItem('crownCart');
                window.location.href = result.checkoutUrl;
            } else {
                alert('Could not start checkout: ' + (result.error || 'Server error'));
                checkoutBtn.disabled = false;
                checkoutBtn.innerText = 'Proceed to Secure Checkout';
            }
        } catch (err) {
            console.error('Checkout error:', err);
            alert('Connection error. Please try again.');
            checkoutBtn.disabled = false;
            checkoutBtn.innerText = 'Proceed to Secure Checkout';
        }
    });
</script>
